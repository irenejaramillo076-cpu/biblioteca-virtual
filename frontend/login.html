<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Bibliotheca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="paper-texture"></div>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand" aria-hidden="true">B</div>
      <p class="eyebrow">Acceso de personal</p>
      <h1 id="login-title">Biblioteca Virtual</h1>
      <p class="login-copy">Ingresa con la cuenta institucional de demostración para administrar el catálogo, los lectores y los préstamos.</p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="login-email">Correo electrónico</label>
          <input id="login-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="login-password">Contraseña</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
      </form>

      <aside class="demo-credentials" aria-label="Configuración de acceso">
        <strong>Acceso protegido</strong>
        <span>La cuenta se configura mediante variables de entorno seguras.</span>
      </aside>
    </section>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
