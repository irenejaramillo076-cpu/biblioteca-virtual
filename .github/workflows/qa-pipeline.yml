name: QA Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  unit-tests:

    name: Unit Tests + Coverage

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npm run test:coverage

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage
          if-no-files-found: error

  e2e-tests:

    name: E2E Playwright + Axe + Allure

    needs: unit-tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 13 E2E Scenarios in Headless Mode
        run: npm run test:e2e

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: warn

      - name: Upload Failure Screenshots and Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-evidence
          path: reports/test-results
          if-no-files-found: warn

  security-scan:

    name: Dependency Security Scan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Fail on High or Critical Vulnerabilities
        run: npm audit --audit-level=high

  sonarcloud-scan:

    name: SonarQube Cloud Scan

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Jest Coverage
        working-directory: backend
        run: npm run test:coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  load-tests:

    name: k6 Load Test

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Seed Database
        working-directory: backend
        run: npm run seed

      - name: Install k6
        uses: grafana/setup-k6-action@v1.2.1

      - name: Start API
        run: |
          mkdir -p reports
          npm --prefix backend start > reports/api-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/salud > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat reports/api-server.log
          exit 1

      - name: Run k6 Load Test
        env:
          BASE_URL: http://127.0.0.1:3000
        run: k6 run --out json=reports/k6-results.json tests/performance/load-test.js

      - name: Upload k6 Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: |
            reports/k6-results.json
            reports/k6-summary.json
            reports/k6-summary.html
            reports/api-server.log
          if-no-files-found: warn

  zap-scan:

    name: OWASP ZAP Baseline Scan

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Seed Database
        working-directory: backend
        run: npm run seed

      - name: Start API for ZAP
        run: |
          mkdir -p reports
          chmod 777 reports
          npm --prefix backend start > reports/zap-api-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/salud > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat reports/zap-api-server.log
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            -t zaproxy/zap-stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -l WARN

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-results
          path: |
            reports/zap-report.html
            reports/zap-report.json
            reports/zap-report.md
            reports/zap-api-server.log
          if-no-files-found: warn
